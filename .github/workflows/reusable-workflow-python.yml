on:
  workflow_call:
    inputs:
      service:
        description: Service directory and image name
        required: true
        type: string
      python-version:
        description: Python version to use
        type: string
        default: "3.12"
      package-manager:
        description: Package manager to use for installs
        type: string
        default: "pip"
      lint:
        description: Run linting
        type: boolean
        default: true
      linter:
        description: Linter to use
        type: string
        default: "ruff"
      unit:
        description: Run unit tests
        type: boolean
        default: true
      test-command:
        description: Command used to run unit tests
        type: string
        default: "python -m unittest discover -s tests"
      build-args:
        description: Docker build arguments
        type: string
        default: ""
      preview-strategy:
        description: Preview environment strategy e.g. shared-dev, isolated-dev, disabled
        type: string
        default: "shared-dev"

jobs:
  sonar:
    if: >-
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    uses: ./.github/workflows/reusable-sonar.yml
    with:
      service: ${{ inputs.service }}
    secrets: inherit

  python:
    if: >-
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    uses: ./.github/workflows/reusable-python.yml
    with:
      service: ${{ inputs.service }}
      python-version: ${{ inputs.python-version }}
      package-manager: ${{ inputs.package-manager }}
      lint: ${{ inputs.lint }}
      linter: ${{ inputs.linter }}
      unit: ${{ inputs.unit }}
      test-command: ${{ inputs.test-command }}
    secrets: inherit

  build:
    needs: [sonar, python]
    uses: ./.github/workflows/reusable-build.yml
    with:
      service: ${{ inputs.service }}
      build-args: ${{ inputs.build-args }}
    secrets: inherit

  trivy:
    needs: build
    uses: ./.github/workflows/reusable-trivy.yml
    with:
      service: ${{ inputs.service }}
    secrets: inherit

  preview-deploy:
    needs: trivy
    uses: ./.github/workflows/reusable-preview.yml
    with:
      service: ${{ inputs.service }}
      strategy: ${{ inputs.preview-strategy }}
      operation: deploy
    secrets: inherit

  preview-cleanup:
    if: github.event.action == 'closed'
    uses: ./.github/workflows/reusable-preview.yml
    with:
      service: ${{ inputs.service }}
      strategy: ${{ inputs.preview-strategy }}
      operation: cleanup
    secrets: inherit

  promote-dev:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-promote.yml
    with:
      service: ${{ inputs.service }}
      environment: dev
    secrets: inherit

  promote-staging:
    needs: promote-dev
    uses: ./.github/workflows/reusable-promote.yml
    with:
      service: ${{ inputs.service }}
      environment: staging
    secrets: inherit

  sync-staging:
    needs: promote-staging
    uses: ./.github/workflows/reusable-sync.yml
    with:
      service: ${{ inputs.service }}
      environment: staging
    secrets: inherit

  promote-prod:
    needs: sync-staging
    uses: ./.github/workflows/reusable-promote.yml
    with:
      service: ${{ inputs.service }}
      environment: prod
    secrets: inherit

  sync-prod:
    needs: promote-prod
    uses: ./.github/workflows/reusable-sync.yml
    with:
      service: ${{ inputs.service }}
      environment: prod
    secrets: inherit
