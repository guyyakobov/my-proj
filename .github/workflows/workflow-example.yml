on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'services/example/**'
    
jobs:
  ci:
    uses: ./.github/workflows/reusable-workflow-node.yml
    with:
      service: example
      preview-strategy: isolated-dev
      node-version: "18"
      package-manager: "pnpm"
    secrets: inherit