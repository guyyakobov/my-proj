apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-single-cluster-v1
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/guyyakobov/my-proj.git
              revision: main
              directories:
                - path: helm/charts/*
              values:
                system: my-proj
          - list:
              elements:
                - env: dev
                - env: staging
                - env: prod
  template:
    metadata:
      name: '{{ .path.basename }}-{{ .env }}'
      labels:
        system: '{{ .system }}'
        environment: '{{ .env }}'
        service: '{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/guyyakobov/my-proj.git
        targetRevision: main
        path: '{{ .path.path }}'
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - ../../global-values/values.yaml
            - '../../global-values/values-{{ .env }}.yaml'
            - values.yaml
            - 'values-{{ .env }}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .values.system }}-{{ .env }}'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        syncOptions:
          - RespectIgnoreDifferences=true
  templatePatch: |
    {{- if eq .env "dev" }}
    spec:
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: false
        syncOptions:
          - RespectIgnoreDifferences=true
    {{- end }}
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true