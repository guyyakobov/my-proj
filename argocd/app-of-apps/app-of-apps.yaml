apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: app-of-apps
  source:
    repoURL: https://github.com/guyyakobov/my-proj.git
    targetRevision: main
    path: argocd/applicationsets
    directory:
      include: 'appset-shared-cluster-v1.yaml'
      # recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true